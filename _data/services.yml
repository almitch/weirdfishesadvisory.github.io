# Service areas, in display order. The `quote` is the client problem each one answers.
- number: "01"
  stage: Measure
  quote: "We're not capturing what we'd need to prove this works."
  question: New or existing, how do we measure and use data?
  body: >-
    Programmes often launch with no way to tell whether they're working. I start
    from the impact you need to prove and work backwards to the data, how it's
    collected and the system that holds it, so it's captured right from day one.
  deliverables:
    - "Impact-to-data map: what you need to prove, and the data that proves it"
    - "Monitoring and evaluation framework"
    - "Data collection and system design your developers can build from"

- number: "02"
  stage: Use
  quote: "We've got data, but it's not helping drive decisions."
  question: You've got data. How do you make sense of it and act on it?
  body: >-
    Most organisations are sitting on data that could be doing more. I work out
    what it's telling you, separate what you can evidence from what you can't
    yet, and get it in front of the people making decisions. Smaller builds I do
    myself in R, Python or Power BI; bigger ones I spec so you can bring in the
    right partner.
  deliverables:
    - "Impact framework: what you can evidence, and how to close the gap"
    - "Funder- and board-ready reporting"
    - "Dashboards and decision-support tools your team can run without me"

- number: "03"
  stage: Scale
  quote: "Our programme works, but it's stuck."
  question: Where should this programme be in five years, and how does it get there?
  body: >-
    Through facilitated workshops I build a theory of change that makes your
    programme's logic explicit, then the strategy to grow it, including how to
    align with the frameworks that govern your field and embed your work in
    policy. I'm doing this now with WRAS, taking it from a voluntary app in
    British Columbia toward regulated navigation across North America.
  deliverables:
    - "Facilitated workshops and a testable theory of change"
    - "Stakeholder and policy landscape: where the leverage is"
    - "Programme strategy and a route from good idea to embedded policy"
