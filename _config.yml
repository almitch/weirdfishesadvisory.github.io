# Site settings
title: Weird Fishes Advisory
tagline: Turning nature data into impact for nature.
description: Environmental consultancy helping NGOs, governments, and the private sector turn nature data into evidence-based policy and measurable impact.
url: "https://weirdfishes.fish"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .obsidian/

# Collections (for future blog if needed)
# collections:
#   posts:
#     output: true
#     permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
