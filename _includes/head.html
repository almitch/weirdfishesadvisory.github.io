<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe6">

  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/web/favicon.svg' | relative_url }}">

  {% seo title=false %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {%- comment -%}
  Titles: Gloock, a high-contrast display serif (one weight, no italic).
  Everything else: Epilogue (SIL OFL), a clean grotesque that pairs with it.
  {%- endcomment -%}
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400..700;1,400..600&family=Gloock&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
